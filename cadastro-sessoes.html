<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Sessões</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- 🔝 MENU -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">🎬 Assista com qualidade </a>

      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="cadastro-filmes.html">Filmes</a></li>
        <li class="nav-item"><a class="nav-link" href="cadastro-salas.html">Salas</a></li>
        <li class="nav-item"><a class="nav-link" href="cadastro-sessoes.html">Sessões</a></li>
        <li class="nav-item"><a class="nav-link" href="venda-ingressos.html">Ingressos</a></li>
        <li class="nav-item"><a class="nav-link" href="sessoes.html">Listagem</a></li>
      </ul>
    </div>
  </nav>

  <!-- 📋 FORMULÁRIO -->
  <div class="container mt-5">
    <h2 class="mb-4">Cadastro de Sessões 🎟️</h2>

    <form id="formSessao">

      <div class="mb-3">
        <label class="form-label">Filme</label>
        <select class="form-select" id="filme" required></select>
      </div>

      <div class="mb-3">
        <label class="form-label">Sala</label>
        <select class="form-select" id="sala" required></select>
      </div>

      <div class="mb-3">
        <label class="form-label">Data e Hora</label>
        <input type="datetime-local" class="form-control" id="dataHora" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Preço</label>
        <input type="number" class="form-control" id="preco" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Idioma</label>
        <select class="form-select" id="idioma" required>
          <option value="">Selecione</option>
          <option>Dublado</option>
          <option>Legendado</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Formato</label>
        <select class="form-select" id="formato" required>
          <option value="">Selecione</option>
          <option>2D</option>
          <option>3D</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary">Salvar Sessão</button>

    </form>
  </div>

  <!-- ⚙️ SCRIPT -->
  <script>

    // 🔄 CARREGAR FILMES E SALAS
    function carregarDados() {
      let filmes = JSON.parse(localStorage.getItem("filmes")) || [];
      let salas = JSON.parse(localStorage.getItem("salas")) || [];

      let selectFilme = document.getElementById("filme");
      let selectSala = document.getElementById("sala");

      // limpar
      selectFilme.innerHTML = "<option value=''>Selecione</option>";
      selectSala.innerHTML = "<option value=''>Selecione</option>";

      // filmes
      filmes.forEach((filme, index) => {
        let option = document.createElement("option");
        option.value = index;
        option.textContent = filme.titulo;
        selectFilme.appendChild(option);
      });

      // salas
      salas.forEach((sala, index) => {
        let option = document.createElement("option");
        option.value = index;
        option.textContent = sala.nome;
        selectSala.appendChild(option);
      });
    }

    // 📥 SALVAR SESSÃO
    document.getElementById("formSessao").addEventListener("submit", function(e) {
      e.preventDefault();

      const filmeId = document.getElementById("filme").value;
      const salaId = document.getElementById("sala").value;
      const dataHora = document.getElementById("dataHora").value;
      const preco = document.getElementById("preco").value;
      const idioma = document.getElementById("idioma").value;
      const formato = document.getElementById("formato").value;

      const sessao = {
        filmeId,
        salaId,
        dataHora,
        preco,
        idioma,
        formato
      };

      let sessoes = JSON.parse(localStorage.getItem("sessoes")) || [];

      sessoes.push(sessao);

      localStorage.setItem("sessoes", JSON.stringify(sessoes));

      alert("Sessão cadastrada com sucesso!");

      document.getElementById("formSessao").reset();
    });

    // 🚀 iniciar
    carregarDados();

  </script>

</body>
</html>
