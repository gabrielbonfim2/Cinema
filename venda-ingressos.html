<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Venda de Ingressos</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <!-- 🔝 MENU -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">🎬 Cinema RapiDEX </a>

      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="cadastro-filmes.html">Filmes</a></li>
        <li class="nav-item"><a class="nav-link" href="cadastro-salas.html">Salas</a></li>
        <li class="nav-item"><a class="nav-link" href="cadastro-sessoes.html">Sessões</a></li>
        <li class="nav-item"><a class="nav-link" href="venda-ingressos.html">Ingressos</a></li>
        <li class="nav-item"><a class="nav-link" href="sessoes.html">Listagem</a></li>
      </ul>
    </div>
  </nav>

  <!-- 📋 FORMULÁRIO -->
  <div class="container mt-5">
    <h2 class="mb-4">Venda de Ingressos 💳</h2>

    <form id="formIngresso">

      <div class="mb-3">
        <label class="form-label">Sessão</label>
        <select class="form-select" id="sessao" required></select>
      </div>

      <div class="mb-3">
        <label class="form-label">Nome do Cliente</label>
        <input type="text" class="form-control" id="nome" required>
      </div>

      <div class="mb-3">
        <label class="form-label">CPF</label>
        <input type="text" class="form-control" id="cpf" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Assento</label>
        <input type="text" class="form-control" id="assento" placeholder="Ex: A10" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Tipo de Pagamento</label>
        <select class="form-select" id="pagamento" required>
          <option value="">Selecione</option>
          <option>Cartão</option>
          <option>Pix</option>
          <option>Dinheiro</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary">Confirmar Venda</button>

    </form>
  </div>

  <!-- ⚙️ SCRIPT -->
  <script>

    // 🔄 CARREGAR SESSÕES
    function carregarSessoes() {
      let sessoes = JSON.parse(localStorage.getItem("sessoes")) || [];
      let filmes = JSON.parse(localStorage.getItem("filmes")) || [];

      let select = document.getElementById("sessao");
      select.innerHTML = "<option value=''>Selecione</option>";

      sessoes.forEach((sessao, index) => {
        let filme = filmes[sessao.filmeId];

        let option = document.createElement("option");
        option.value = index;
        option.textContent = `${filme.titulo} - ${sessao.dataHora}`;

        select.appendChild(option);
      });
    }

    // 📥 SALVAR INGRESSO
    document.getElementById("formIngresso").addEventListener("submit", function(e) {
      e.preventDefault();

      const sessaoId = document.getElementById("sessao").value;
      const nome = document.getElementById("nome").value;
      const cpf = document.getElementById("cpf").value;
      const assento = document.getElementById("assento").value;
      const pagamento = document.getElementById("pagamento").value;

      const ingresso = {
        sessaoId,
        nome,
        cpf,
        assento,
        pagamento
      };

      let ingressos = JSON.parse(localStorage.getItem("ingressos")) || [];

      ingressos.push(ingresso);

      localStorage.setItem("ingressos", JSON.stringify(ingressos));

      alert("Ingresso vendido com sucesso!");

      document.getElementById("formIngresso").reset();
    });

    // 🚀 INICIAR
    carregarSessoes();

  </script>

</body>
</html>
