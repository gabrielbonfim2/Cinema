<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Filmes</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- 🔝 MENU -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">🎬 Cinema RapiDEX </a>

      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="cadastro-filmes.html">Filmes</a></li>
        <li class="nav-item"><a class="nav-link" href="cadastro-salas.html">Salas</a></li>
        <li class="nav-item"><a class="nav-link" href="cadastro-sessoes.html">Sessões</a></li>
        <li class="nav-item"><a class="nav-link" href="venda-ingressos.html">Ingressos</a></li>
        <li class="nav-item"><a class="nav-link" href="sessoes.html">Listagem</a></li>
      </ul>
    </div>
  </nav>

  <!-- 📋 FORMULÁRIO -->
  <div class="container mt-5">
    <h2 class="mb-4">Cadastro de Filmes 🎥</h2>

    <form id="formFilme">

      <div class="mb-3">
        <label class="form-label">Título</label>
        <input type="text" class="form-control" id="titulo" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Gênero</label>
        <input type="text" class="form-control" id="genero" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Descrição</label>
        <textarea class="form-control" id="descricao" required></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Classificação Indicativa</label>
        <select class="form-select" id="classificacao" required>
          <option value="">Selecione</option>
          <option>Livre</option>
          <option>10+</option>
          <option>12+</option>
          <option>14+</option>
          <option>16+</option>
          <option>18+</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Duração (minutos)</label>
        <input type="number" class="form-control" id="duracao" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Data de Estreia</label>
        <input type="date" class="form-control" id="data" required>
      </div>

      <button type="submit" class="btn btn-primary">Salvar Filme</button>

    </form>

    <!-- 🎬 LISTA DE FILMES -->
    <h3 class="mt-5">Filmes Cadastrados 🎬</h3>

    <table class="table table-striped">
      <thead>
        <tr>
          <th>Título</th>
          <th>Gênero</th>
          <th>Duração</th>
          <th>Classificação</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="listaFilmes"></tbody>
    </table>

  </div>

  <!-- ⚙️ SCRIPT -->
  <script>

    function carregarFilmes() {
      let filmes = JSON.parse(localStorage.getItem("filmes")) || [];

      let tabela = document.getElementById("listaFilmes");
      tabela.innerHTML = "";

      if (filmes.length === 0) {
        tabela.innerHTML = "<tr><td colspan='5'>Nenhum filme cadastrado</td></tr>";
        return;
      }

      filmes.forEach((filme, index) => {
        let linha = `
          <tr>
            <td>${filme.titulo}</td>
            <td>${filme.genero}</td>
            <td>${filme.duracao} min</td>
            <td>${filme.classificacao}</td>
            <td>
              <button class="btn btn-danger btn-sm" onclick="excluirFilme(${index})">Excluir</button>
            </td>
          </tr>
        `;

        tabela.innerHTML += linha;
      });
    }

    function excluirFilme(index) {
      let filmes = JSON.parse(localStorage.getItem("filmes")) || [];

      if (!confirm("Tem certeza que deseja excluir este filme?")) return;

      filmes.splice(index, 1);

      localStorage.setItem("filmes", JSON.stringify(filmes));

      carregarFilmes();
    }

    document.getElementById("formFilme").addEventListener("submit", function(e) {
      e.preventDefault();

      const titulo = document.getElementById("titulo").value;
      const genero = document.getElementById("genero").value;
      const descricao = document.getElementById("descricao").value;
      const classificacao = document.getElementById("classificacao").value;
      const duracao = document.getElementById("duracao").value;
      const data = document.getElementById("data").value;

      const filme = {
        titulo,
        genero,
        descricao,
        classificacao,
        duracao,
        data
      };

      let filmes = JSON.parse(localStorage.getItem("filmes")) || [];

      filmes.push(filme);

      localStorage.setItem("filmes", JSON.stringify(filmes));

      alert("Filme cadastrado com sucesso!");

      this.reset();

      carregarFilmes();
    });

    carregarFilmes();

  </script>

</body>
</html>
