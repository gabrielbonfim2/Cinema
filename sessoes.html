<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Sessões Disponíveis</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <!-- 🔝 MENU -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">🎬 Cinema</a>

      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="cadastro-filmes.html">Filmes</a></li>
        <li class="nav-item"><a class="nav-link" href="cadastro-salas.html">Salas</a></li>
        <li class="nav-item"><a class="nav-link" href="cadastro-sessoes.html">Sessões</a></li>
        <li class="nav-item"><a class="nav-link" href="venda-ingressos.html">Ingressos</a></li>
        <li class="nav-item"><a class="nav-link" href="sessoes.html">Listagem</a></li>
      </ul>
    </div>
  </nav>

  <!-- 📋 LISTAGEM -->
  <div class="container mt-5">
    <h2 class="mb-4">Sessões Disponíveis 🎟️</h2>

    <div id="listaSessoes" class="row"></div>
  </div>

  <!-- ⚙️ SCRIPT -->
  <script>

    function carregarSessoes() {
      let sessoes = JSON.parse(localStorage.getItem("sessoes")) || [];
      let filmes = JSON.parse(localStorage.getItem("filmes")) || [];
      let salas = JSON.parse(localStorage.getItem("salas")) || [];

      let container = document.getElementById("listaSessoes");
      container.innerHTML = "";

      if (sessoes.length === 0) {
        container.innerHTML = "<p>Nenhuma sessão cadastrada.</p>";
        return;
      }

      sessoes.forEach((sessao, index) => {
        let filme = filmes[sessao.filmeId];
        let sala = salas[sessao.salaId];

        let card = document.createElement("div");
        card.className = "col-md-4";

        card.innerHTML = `
          <div class="card mb-4">
            <div class="card-body">
              <h5 class="card-title">${filme.titulo}</h5>
              <p><strong>Sala:</strong> ${sala.nome}</p>
              <p><strong>Data:</strong> ${sessao.dataHora}</p>
              <p><strong>Preço:</strong> R$ ${sessao.preco}</p>

              <a href="venda-ingressos.html?sessao=${index}" class="btn btn-success">
                Comprar Ingresso
              </a>
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    carregarSessoes();

  </script>

</body>
</html>
